name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Point gradle to SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Install Gradle 8.9
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip -d "$HOME/gradle_home"
          echo "$HOME/gradle_home/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish APK as Release
        uses: softprops/action-gh-release@v2
        with:
          tag: apk-v${{ github.run_number }}
          name: Waimai APK build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
